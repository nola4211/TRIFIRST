services:
  - type: web
    name: trifirst-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn trifirst.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
